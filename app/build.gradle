plugins {
    id 'com.android.application'
}
android {
    namespace 'com.pulse.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pulse.keyboard'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.4.0-alpha'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
